<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/staff_Registration.css">
    <script src="js/staff_Registration.js" defer></script>

    <title>Eventora - Staff Registration Form</title>

</head>
<body>
    
    <h1>Eventora</h1>
    <h2>Staff Registration Form</h2>

    <form id="registrationForm">
        <label for="staffName">Staff Name:</label>
        <input type="text" id="staffName" placeholder="Enter your name" required>

        <label for="staffEmail">Staff Email:</label>
        <input type="email" id="staffEmail" placeholder="Enter your email" required>

        <label for="staffPassword">Password:</label>
        <input type="password" id="staffPassword" placeholder="Enter your password" required>

        <button type="submit">Register</button>
    </form>

    <p id="message"></p>
    
</body>
</html>
