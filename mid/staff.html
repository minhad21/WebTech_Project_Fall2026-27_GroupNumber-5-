<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/staff_style.css">
    <script src="js/staff_script.js" defer></script>

    <title>Eventora - Staff Dashboard</title>
</head>
<body>
    
    <h1>Eventora</h1>
    <h2>Staff Dashboard</h2>

     
        <fieldset>
            
            <legend>Search and Check Event Tickets :</legend>              
            <form id="searchForm">
            <label for="bookingRef">Booking Reference:</label>

            <div class="search-row">
                <input  type="text" id="bookingRef" placeholder="Enter booking ID"  required>
                <button type="submit">Search</button>
            </div>
        </form>
    </fieldset>
    <p id="message"></p>

    <div id="ticketDetails" hidden>
        <h3>Ticket Details</h3>

        <p>
            <b>Booking ID:</b>
            <span id="ref"></span>
        </p>

        <p>
            <b>Attendee Name:</b>
            <span id="attendee"></span>
        </p>

        <p>
            <b>Event:</b>
            <span id="eventName"></span>
        </p>

        <p>
            <b>Quantity:</b>
            <span id="quantity"></span>
        </p>

        <p>
            <b>Ticket Status:</b>
            <span id="status"></span>
        </p>

        <button type="button" id="checkInBtn"> Check In </button>
    </div>

</body>
</html>
