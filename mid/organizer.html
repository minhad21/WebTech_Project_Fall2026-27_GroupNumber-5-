
<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/organizer.css">
    <script src="js/organizer.js" defer></script>

    <title>Eventora - Organizer Dashboard</title>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Eventora</h1>
            <h2>Organizer Dashboard</h2>
            <p>Manage your events easily</p>
        </div>

        <form id="eventForm">

            <fieldset>
                <legend>Event Information</legend>

                <table>
                    <tr>
                        <td>
                            <label for="eventName">Event Name:</label>
                        </td>
                        <td>
                            <input type="text" name="eventName"
                                id="eventName"
                                placeholder="Enter Event Name">
                            <p id="NameError" class="error"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="eventDate">Event Date:</label>
                        </td>
                        <td>
                            <input type="date" name="eventDate"
                                id="eventDate">
                            <p id="DateError" class="error"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="venue">Venue:</label>
                        </td>
                        <td>
                            <input type="text" name="venue"
                                id="venue"
                                placeholder="Enter Event Venue">
                            <p id="VenueError" class="error"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="ticketPrice">Ticket Price:</label>
                        </td>
                        <td>
                            <input type="number" name="ticketPrice"
                                id="ticketPrice"
                                placeholder="Enter Ticket Price"
                                min="0.01" step="0.01">
                            <p id="PriceError" class="error"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="capacity">Event Capacity:</label>
                        </td>
                        <td>
                            <input type="number" name="capacity"
                                id="capacity"
                                placeholder="Enter Maximum Capacity"
                                min="1" step="1">
                            <p id="CapacityError" class="error"></p>
                        </td>
                    </tr>
                </table>

            </fieldset>

            <br>

            <input type="submit" id="submit" value="Add Event">
            <input type="reset" id="reset" value="Reset">

        </form>

        <br>

        <div class="event-section">

            <h3>My Events</h3>

            <input type="text" id="searchEvent"
                placeholder="Search Event by Name">

            <p id="totalEvents">Total Events: 0</p>

            <div id="eventList">
                <!-- Newly added events will appear here -->
            </div>

        </div>

    </div>

    <div class="footer">
        <h5>Eventora - Event Management System</h5>
    </div>

</body>
</html>
