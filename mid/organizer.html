<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventora | Organizer Dashboard</title>
    <link rel="stylesheet" href="css/organizer.css">
    <script src="js/organizer.js" defer></script>
</head>
<body>

    <div class="container">

        <header class="header">
            <h1>Eventora</h1>
            <h2>Organizer Dashboard</h2>
            <p>Manage your events easily and efficiently.</p>
        </header>

        <main>
            <form id="eventForm">
                <fieldset>
                    <legend id="formLegend">Add New Event</legend>

                    <table>
                        <tr>
                            <td>
                                <label for="eventName">Event Name</label>
                            </td>
                            <td>
                                <input type="text" id="eventName" name="eventName"
                                       placeholder="Enter event name">
                                <div class="error" id="NameError"></div>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="eventDate">Event Date</label>
                            </td>
                            <td>
                                <input type="date" id="eventDate" name="eventDate">
                                <div class="error" id="DateError"></div>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="eventVenue">Venue</label>
                            </td>
                            <td>
                                <input type="text" id="eventVenue" name="eventVenue"
                                       placeholder="Enter event venue">
                                <div class="error" id="VenueError"></div>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="eventPrice">Ticket Price (BDT)</label>
                            </td>
                            <td>
                                <input type="number" id="eventPrice" name="eventPrice"
                                       min="0" placeholder="Enter ticket price">
                                <div class="error" id="PriceError"></div>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="eventCapacity">Event Capacity</label>
                            </td>
                            <td>
                                <input type="number" id="eventCapacity" name="eventCapacity"
                                       min="1" placeholder="Enter maximum capacity">
                                <div class="error" id="CapacityError"></div>
                            </td>
                        </tr>

                        <tr>
                            <td></td>
                            <td>
                                <input type="submit" id="submitBtn" value="Add Event">
                                <input type="reset" id="resetBtn" value="Reset">
                            </td>
                        </tr>
                    </table>
                </fieldset>
            </form>

            <section class="event-section">
                <h3>My Events</h3>

                <input type="text" id="searchEvent"
                       placeholder="Search events by name or venue...">

                <p id="totalEvents">Total Events: 0</p>

                <div id="eventList">
                    <p id="emptyMessage">No events added yet.</p>
                </div>
            </section>

            <div class="logout-section">
                <button type="button" id="logoutBtn">Logout</button>
            </div>
        </main>

    </div>

</body>
</html>
