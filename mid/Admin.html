<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Eventora Admin</title>
        <link rel="stylesheet" href="admin.css">
        <script src="admin.js"></script>
    </head>

    <body class="admin" onload="checkLogin()" onpageshow="if(event.persisted){checkLogin();}">

        <div class="header attached">
            <h1>Eventora</h1>
            <h2>Admin Dashboard</h2>
        </div>

        <div class="topnav">
            
            <a href="organizer.html">Organizer</a>
            <a href="staff.html">Staff</a>
            <a href="manager.html">Manager</a>
        </div>

        <div class="userbar">
            <span id="WelcomeText"></span>
        </div>

        <!-- novalidate turns off the browser's own checks, so our JavaScript does all the validation -->
        <form onsubmit="return validateSummaryForm()" onreset="clearSummaryErrors()" novalidate>

            <fieldset>
                <legend>Summary</legend>
                <table>
                    <tr>
                        <td><label for="TotalUsers">Total Users:</label></td>
                        <td><input type="number" id="TotalUsers" placeholder="Enter total users">
                            <p class="error" id="UsersError"></p></td>
                    </tr>
                    <tr>
                        <td><label for="TotalEvents">Total Events:</label></td>
                        <td><input type="number" id="TotalEvents" placeholder="Enter total events">
                            <p class="error" id="EventsError"></p></td>
                    </tr>
                    <tr>
                        <td><label for="TotalBookings">Total Bookings:</label></td>
                        <td><input type="number" id="TotalBookings" placeholder="Enter total bookings">
                            <p class="error" id="BookingsError"></p></td>
                    </tr>
                </table>

                <p id="SummaryResult"></p>

                <input type="submit" id="updateSummary" value="Update Summary">
                <input type="reset" id="clearSummary" value="Clear">
            </fieldset>

        </form>

        <form onsubmit="return addCategory()" novalidate>

            <fieldset>
                <legend>Manage Categories</legend>
                <table>
                    <tr>
                        <td><label for="CategoryName">Category Name:</label></td>
                        <td><input type="text" id="CategoryName" placeholder="Enter your username">
                            <p class="error" id="CategoryError"></p></td>
                    </tr>
                </table>

                <input type="submit" id="addCategoryBtn" value="Add Category">

                <p id="CategoryMessage"></p>

                <table id="categoryList" border="1">
                    <tr>
                        <th>Category</th>
                        <th>Action</th>
                    </tr>
                    <tr>
                        <td>Concert</td>
                        <td><button type="button" class="deleteBtn" onclick="deleteCategory(this)">Delete</button></td>
                    </tr>
                    <tr>
                        <td>Conference</td>
                        <td><button type="button" class="deleteBtn" onclick="deleteCategory(this)">Delete</button></td>
                    </tr>
                    <tr>
                        <td>Workshop</td>
                        <td><button type="button" class="deleteBtn" onclick="deleteCategory(this)">Delete</button></td>
                    </tr>
                </table>
            </fieldset>

        </form>

        <div class="logout-row">
            <input type="button" id="logoutBtn" value="Logout" onclick="logout()">
        </div>

        <div class="footer">
            <h5>&copy; 2026 Eventora - CSC 3215 Web Technologies</h5>
        </div>
    </body>
</html>
