<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Eventora Admin </title>
        <link rel="stylesheet" href="admin_style.css">
        <script src="admin_style.js" defer></script>
    </head>
    <body>
        <div class="container">

            <div class="header">
                <h1> Eventora </h1>
                <h2> Admin Dashboard </h2>
            </div>

            <fieldset>
                <legend> Admin Registration </legend>

                
                <form onsubmit="return validateAdminForm()" onreset="clearAllErrors()" novalidate>

                    <fieldset>
                        <legend>Admin Information</legend>
                        <table>
                            <tr>
                                <td><label for="AdminName">Full Name:</label></td>
                                <td><input type="text" id="AdminName" placeholder="Enter full name">
                                    <p class="error" id="NameError"></p></td>
                            </tr>
                            <tr>
                                <td><label for="AdminID">Admin ID:</label></td>
                                <td><input type="text" id="AdminID" placeholder="e.g. ADM-1234">
                                    <p class="error" id="AdminIDError"></p></td>
                            </tr>
                            <tr>
                                <td><label for="AdminEmail">Email:</label></td>
                                <td><input type="email" id="AdminEmail" placeholder="Enter email">
                                    <p class="error" id="EmailError"></p></td>
                            </tr>
                            <tr>
                                <td><label for="AdminPhone">Phone:</label></td>
                                <td><input type="tel" id="AdminPhone" placeholder="e.g. 01712345678">
                                    <p class="error" id="PhoneError"></p></td>
                            </tr>
                            <tr>
                                <td><label>Gender:</label></td>
                                <td>
                                    <label class="choice"><input type="radio" name="gender" value="Male"> Male</label>
                                    <label class="choice"><input type="radio" name="gender" value="Female"> Female</label>
                                    <label class="choice"><input type="radio" name="gender" value="Other"> Other</label>
                                    <p class="error" id="GenderError"></p>
                                </td>
                            </tr>
                            <tr>
                                <td><label for="AdminRole">Admin Role:</label></td>
                                <td>
                                    <select id="AdminRole">
                                        <option value="">-- Select Role --</option>
                                        <option value="Super Admin">Super Admin</option>
                                        <option value="System Admin">System Admin</option>
                                        <option value="HR Admin">HR Admin</option>
                                    </select>
                                    <p class="error" id="RoleError"></p>
                                </td>
                            </tr>
                        </table>
                    </fieldset>

                    <fieldset>
                        <legend>Permissions</legend>
                        <table>
                            <tr>
                                <td><label>Can Manage:</label></td>
                                <td>
                                    <label class="choice"><input type="checkbox" name="permission" value="Customer"> Customer</label>
                                    <label class="choice"><input type="checkbox" name="permission" value="Organizer"> Organizer</label>
                                    <label class="choice"><input type="checkbox" name="permission" value="Staff"> Staff</label>
                                    <p class="error" id="PermissionError"></p>
                                </td>
                            </tr>
                        </table>
                    </fieldset>

                    <fieldset>
                        <legend>Account</legend>
                        <table>
                            <tr>
                                <td><label for="UserName">Username:</label></td>
                                <td><input type="text" id="UserName" placeholder="4 - 15 characters">
                                    <p class="error" id="UserNameError"></p></td>
                            </tr>
                            <tr>
                                <td><label for="Password">Password:</label></td>
                                <td><input type="password" id="Password" placeholder="Enter password">
                                
                                    <p class="error" id="PasswordError"></p></td>
                            </tr>
                            <tr>
                                <td><label for="ConfirmPassword">Confirm Password:</label></td>
                                <td><input type="password" id="ConfirmPassword" placeholder="Re-enter password">
                                    <p class="error" id="ConfirmError"></p></td>
                            </tr>
                        </table>
                    </fieldset>

                    <p id="ResultText"></p>

                    <input type="submit" id="submit" value="Register">
                    <input type="reset" id="reset" value="Reset">
                </form>
            </fieldset>

            <fieldset>
                <legend> Summary </legend>
                <form id="summaryForm">
                    <table>
                        <tr>
                            <td> <label for="totalUsers"> Total Users : </label> </td>
                            <td> <input type="number" name="totalUsers" id="totalUsers" min="0" placeholder="Enter total users"> </td>
                        </tr>
                        <tr>
                            <td> <label for="totalEvents"> Total Events : </label> </td>
                            <td> <input type="number" name="totalEvents" id="totalEvents" min="0" placeholder="Enter total events"> </td>
                        </tr>
                        <tr>
                            <td> <label for="totalBookings"> Total Bookings : </label> </td>
                            <td> <input type="number" name="totalBookings" id="totalBookings" min="0" placeholder="Enter total bookings"> </td>
                        </tr>
                        <tr>
                            <td> </td>
                            <td>
                                <input type="submit" id="updateSummaryBtn" value="Update Summary">
                                <input type="reset" id="clearSummaryBtn" value="Clear">
                            </td>
                        </tr>
                    </table>
                </form>
                <p id="summaryMessage"> </p>
            </fieldset>

            <fieldset>
                <legend> Manage Categories </legend>
                <form id="categoryForm">
                    <table>
                        <tr>
                            <td> <label for="categoryName"> Category Name : </label> </td>
                            <td> <input type="text" name="categoryName" id="categoryName" placeholder="Enter your username"> </td>
                            <td> <input type="submit" id="addCategoryBtn" value="Add Category"> </td>
                        </tr>
                    </table>
                </form>

                <p id="message"> </p>

                <table id="categoryList" border="1">
                    <tr>
                        <th> Category </th>
                        <th> Action </th>
                    </tr>
                    <tr>
                        <td> Concert </td>
                        <td> <button class="deleteBtn"> Delete </button> </td>
                    </tr>
                    <tr>
                        <td> Conference </td>
                        <td> <button class="deleteBtn"> Delete </button> </td>
                    </tr>
                    <tr>
                        <td> Workshop </td>
                        <td> <button class="deleteBtn"> Delete </button> </td>
                    </tr>
                </table>
            </fieldset>

            <div class="footer">
                <h5> &copy; 2026 Eventora - CSC 3215 Web Technologies </h5>
            </div>

        </div>
    </body>
</html>
