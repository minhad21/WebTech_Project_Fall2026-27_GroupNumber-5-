
<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/staff_registration.css">
    <script src="js/staff_registration.js" defer></script>

    <title>Eventora - Staff Registration Form</title>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Eventora</h1>
            <h2>Staff Registration Form</h2>
        </div>

        <form id="staffregistrationForm" onsubmit="return collect_data()">

            <fieldset>
                <legend>Staff's Personal Information</legend>

                <table>
                    <tr>
                        <td>
                            <label for="Name"> Name:</label>
                        </td>
                        <td>
                            <input type="text" name="Name" id="Name" placeholder="Enter Your Name">
                            <p id="NameError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="Age">Age:</label>
                        </td>
                        <td>
                            <input type="number" name="Age" id="Age" placeholder="Enter Your Age">
                            <p id="AgeError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="Email">Email:</label>
                        </td>
                        <td>
                            <input type="text" name="Email" id="Email" placeholder="Enter Your Email">
                            <p id="EmailError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label>Gender:</label>
                        </td>
                        <td>
                            <input type="radio" name="gender" id="Male" value="Male">
                            <label for="Male">Male</label>

                            <input type="radio" name="gender" id="Female" value="Female">
                            <label for="Female">Female</label>

                            <p id="GenderError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="DOB">Date of Birth:</label>
                        </td>
                        <td>
                            <input type="date" name="DOB" id="DOB">
                            <p id="DOBError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="Phone">Phone Number:</label>
                        </td>
                        <td>
                            <input type="tel" name="Phone" id="Phone" placeholder="Enter Your Phone Number">
                            <p id="PhoneError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="Address">Address:</label>
                        </td>
                        <td>
                            <textarea id="Address" for="Address"  style="resize: none;"> </textarea>
                            <p id="AddressError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="Country">Country:</label>
                        </td>
                        <td>
                            <select name="Country" id="Country">
                                <option value="">Select Country</option>
                                <option value="Bangladesh">Bangladesh</option>
                                <option value="USA">USA</option>
                                <option value="UK">UK</option>
                                <option value="Australia">Australia</option>
                                <option value="Japan">Japan</option>
                            </select>
                            <p id="CountryError"></p>
                        </td>
                    </tr>
                </table>
            </fieldset>

            <br>

            <fieldset>
                <legend>Account Information</legend>

                <table>
                    <tr>
                        <td>
                            <label for="username">Username:</label>
                        </td>
                        <td>
                            <input type="text" name="username" id="username" placeholder="Enter Username">
                            <p id="UsernameError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="password">Password:</label>
                        </td>
                        <td>
                            <input type="password" name="password" id="password" placeholder="Enter Password">
                            <p id="PasswordError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="confirmPassword">Confirm Password:</label>
                        </td>
                        <td>
                            <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Confirm Password">
                            <p id="ConfirmPasswordError"></p>
                        </td>
                    </tr>
                </table>
            </fieldset>

            <br>

            <input type="submit" id="submit" value="Register">
            <input type="reset" id="reset" value="Reset">

        </form>
        <p class="login-link">
            Already have an account?
            <a href="staff_login.html">Login Here</a>
        </p>

    </div>

    <div class="footer">
        <h5>Eventora - Event Management System</h5>
    </div>

</body>
</html>
